<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mock payment gateway</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="mock-gateway">
    <h1>Mock payment gateway</h1>
    <p>This page stands in for a real payment provider. No money moves.</p>
    <p>Payment <code>{{paymentId}}</code>: {{currency}} {{amount}} ({{status}})</p>
    <form method="post" action="{{action}}">
      <button type="submit" name="outcome" value="SUCCESS">Pay</button>
      <button type="submit" name="outcome" value="FAILURE">Fail payment</button>
    </form>
  </main>
</body>
</html>
