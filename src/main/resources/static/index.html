<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>BookMyShow on Jolt</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/" aria-label="BookMyShow on Jolt, home">
        <span class="brand-mark" aria-hidden="true">B</span>
        <span class="brand-name">BookMyShow <span class="brand-sub">on Jolt</span></span>
      </a>
      <nav class="site-nav" aria-label="Main">
        <ul id="nav-links">
          <li><a href="/movies">Movies</a></li>
        </ul>
      </nav>
      <div class="header-tools">
        <button type="button" id="city-button" class="chip-button" aria-haspopup="dialog" hidden></button>
        <button type="button" id="theme-toggle" class="icon-button" aria-label="Dark theme" aria-pressed="false">
          <span aria-hidden="true" class="theme-icon"></span>
        </button>
      </div>
    </div>
  </header>
  <main id="main" class="wrap" tabindex="-1">
    <p class="loading">Loading</p>
  </main>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
  <dialog id="city-dialog" aria-labelledby="city-dialog-title">
    <form method="dialog" class="dialog-body">
      <h2 id="city-dialog-title">Choose your city</h2>
      <div id="city-dialog-list" class="city-list"></div>
      <div class="dialog-actions">
        <button type="submit" value="cancel" class="button ghost">Close</button>
      </div>
    </form>
  </dialog>
  <footer class="site-footer">
    <div class="wrap">
      <p>Reference app for the <a href="https://github.com/THIRU-1074/custom-Http-Server">Jolt</a> HTTP framework. Payments use a mock gateway; no real money moves.</p>
    </div>
  </footer>
</body>
</html>
